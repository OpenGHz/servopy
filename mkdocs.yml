site_name: ServoPy
site_description: 独立于 ROS 的 C++ / Python 在线伺服，从入门到设备接入
repo_url: https://github.com/OpenGHz/servopy
repo_name: OpenGHz/servopy
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  logo: assets/brand/mark.svg
  favicon: assets/brand/mark.svg
  language: zh
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 文档首页: index.md
  - 开始使用:
      - 快速上手: getting-started.md
      - 模型、目标与参考: concepts.md
      - Panda 仿真: mujoco-panda.md
  - 控制教程:
      - 关节位置与速度: joint-position.md
      - Python 位置 IK: python-ik.md
      - Ruckig 平滑: smoothing.md
      - 微分 IK、QP 与零空间: solvers.md
      - 周期调度与设备: runtime.md
      - 外部目标、记录与对照: recording.md
      - 原生 C++: cpp.md
  - 参考与排障:
      - Python API: api.md
      - 配置参数: configuration.md
      - 动作与诊断: status.md
      - 命令行: cli.md
      - 排障指南: troubleshooting.md
  - 设计与开发:
      - 执行契约（英文）: design.md
      - 验证记录（英文）: validation.md
      - 功能状态: roadmap.md
      - 更新与迁移: changelog.md
      - 贡献指南: contributing.md
      - 旧入口导航: advanced-control.md

validation:
  nav:
    not_found: warn
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
